<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organigrama Juventud</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header-section">
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-4 md:gap-8 flex-wrap md:flex-nowrap relative z-10">
    <img src="chema1.png" alt="Juventud" class="header-logo" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22 viewBox=%220 0 120 120%22><rect width=%22120%22 height=%22120%22 rx=%2212%22 fill=%22%23032A60%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.35em%22 fill=%22white%22 font-size=%2216%22 font-family=%22Arial%22 font-weight=%22bold%22>JUVENTUD</text></svg>'">
    <div class="text-center flex-1 min-w-0">
      <h1 class="title-font text-3xl md:text-5xl lg:text-6xl font-bold text-[#032A60] tracking-wider uppercase leading-none">
        Organigrama Juventud
      </h1>
      <div class="mt-3 flex items-center justify-center gap-3 text-xs md:text-sm font-bold text-[#009944] uppercase tracking-widest">
        <span class="h-0.5 w-8 md:w-14 bg-[#009944]"></span>
        <span>Estructura Institucional</span>
        <span class="h-0.5 w-8 md:w-14 bg-[#009944]"></span>
      </div>
    </div>
    <img src="chema2.png" alt="Juventud" class="header-logo" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22 viewBox=%220 0 120 120%22><rect width=%22120%22 height=%22120%22 rx=%2212%22 fill=%22%23009944%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.35em%22 fill=%22white%22 font-size=%2216%22 font-family=%22Arial%22 font-weight=%22bold%22>JUVENTUD</text></svg>'">
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 md:px-8 py-8 md:py-12">

  <div id="loading-screen" class="text-center py-20 text-gray-500">
    <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
    <p>Cargando estructura desde data.md...</p>
  </div>

  <div id="app-content" style="display: none;">
    <div class="view-switcher no-print">
      <button class="view-btn active" onclick="switchView('tree', event)"><i class="fas fa-sitemap"></i> Organigrama</button>
      <button class="view-btn" onclick="switchView('map-v', event)"><i class="fas fa-project-diagram"></i> Mapa Vertical</button>
      <button class="view-btn" onclick="switchView('map-h', event)"><i class="fas fa-stream"></i> Mapa Horizontal</button>
      <button class="view-btn" onclick="switchView('workflow', event)"><i class="fas fa-route"></i> Flujo de Trabajo</button>
    </div>

    <div id="workflow-controls" style="display: none;" class="workflow-panel mb-8 no-print">
      <h3 class="title-font text-xl font-bold text-[#032A60] mb-4 uppercase tracking-wider">
        <i class="fas fa-exchange-alt mr-2"></i>Configuración de Flujo de Información
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-2">Emisor (Origen)</label>
          <select id="emisor-select" class="workflow-select"></select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-2">Receptor (Destino)</label>
          <select id="receptor-select" class="workflow-select"></select>
        </div>
      </div>
      <button class="control-btn green w-full md:w-auto" onclick="calculatePath()">
        <i class="fas fa-magic"></i> Trazar Ruta y Mostrar Pasos
      </button>
      <div id="workflow-summary" class="workflow-summary"></div>
    </div>

    <div id="controls-bar" class="controls no-print">
      <button class="control-btn green" onclick="expandAll()"><i class="fas fa-expand-arrows-alt"></i> Expandir Todo</button>
      <button class="control-btn" onclick="collapseAll()"><i class="fas fa-compress-arrows-alt"></i> Contraer Todo</button>
      <button class="control-btn yellow" onclick="window.print()"><i class="fas fa-print"></i> Imprimir</button>
    </div>

    <div id="view-container" class="org-tree"></div>

    <div class="legend no-print">
      <div class="legend-item"><div class="legend-color" style="background: #009944;"></div><span>Dirección General</span></div>
      <div class="legend-item"><div class="legend-color" style="background: #032A60;"></div><span>Subdirecciones</span></div>
      <div class="legend-item"><div class="legend-color" style="background: #FFD100;"></div><span>Departamentos</span></div>
      <div class="legend-item"><div class="legend-color" style="background: #00A8FF;"></div><span>Coordinaciones</span></div>
    </div>
  </div>
</main>

<footer class="footer no-print">
  <p class="title-font font-bold text-[#032A60] text-lg uppercase tracking-wider">Instituto Juventud</p>
  <p class="mt-2">Organigrama Institucional · Sistema de Visualización Jerárquica</p>
</footer>

<script src="script.js"></script>
</body>
</html>
